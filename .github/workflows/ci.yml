name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: khisso-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test the network layer
        run: go test ./...

      - name: Build Dadi.xcframework
        run: ./scripts/build-xcframework.sh

      - name: Build DadiTunnel
        working-directory: apple
        run: xcodebuild -scheme DadiTunnel -destination 'generic/platform=iOS' build

      - name: Test the app in the iOS Simulator; build it with the watch app
        working-directory: app
        run: |
          brew install xcodegen
          printf 'DEVELOPMENT_TEAM =\n' > Signing.xcconfig
          xcodegen generate
          sim=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project Khisso.xcodeproj -scheme Dadi -destination "id=$sim" CODE_SIGNING_ALLOWED=NO test
          xcodebuild -project Khisso.xcodeproj -scheme Dadi -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build

      - name: Package xcframework
        run: |
          cd build
          ditto -c -k --keepParent Dadi.xcframework Dadi.xcframework.zip
          shasum -a 256 Dadi.xcframework.zip | tee Dadi.xcframework.zip.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: xcframework
          path: build/Dadi.xcframework.zip*

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: xcframework
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: khisso-network-${{ github.sha }}
          name: khisso network ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
