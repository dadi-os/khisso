name: Khisso
options:
  bundleIdPrefix: com.dadi
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Dadi:
    type: application
    scheme:
      testTargets: [DadiTests]
    platform: iOS
    sources: [Dadi]
    dependencies:
      - framework: ../build/Dadi.xcframework
        embed: false
      - sdk: libresolv.tbd
      - target: DadiWatch
    settings:
      base:
        PRODUCT_NAME: dadi
        PRODUCT_MODULE_NAME: Khisso
        PRODUCT_BUNDLE_IDENTIFIER: com.dadi.khisso
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: Dadi/Info.plist
      properties:
        CFBundleDisplayName: dadi
        UIAppFonts: [NotoSansGujarati.ttf]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSFaceIDUsageDescription: dadi asks for Face ID before showing or copying a password from Chaavi.
        NSCameraUsageDescription: dadi scans the setup code your box shows when you add this device.
        NSLocalNetworkUsageDescription: dadi connects straight to your box when you are on the same network.
        NSAppTransportSecurity:
          NSExceptionDomains:
            dadi:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
  DadiWatch:
    type: application
    platform: watchOS
    sources:
      - DadiWatch
      - Dadi/Shared/Watch
      - Dadi/Shared/Design/Design.swift
      - Dadi/Shared/Components/Lanes.swift
      - Dadi/Shared/Components/Agent.swift
      - Dadi/Types/Hath.swift
      - Dadi/Fonts/NotoSansGujarati.ttf
      - path: Dadi/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: dadi
        PRODUCT_MODULE_NAME: KhissoWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.dadi.khisso.watchkitapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    info:
      path: DadiWatch/Info.plist
      properties:
        CFBundleDisplayName: dadi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dadi.khisso
        UIAppFonts: [NotoSansGujarati.ttf]
  DadiTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DadiTests]
    dependencies:
      - target: Dadi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dadi.khisso.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/dadi.app/dadi
        BUNDLE_LOADER: $(TEST_HOST)
